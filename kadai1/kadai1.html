    <script>
        const leaves = document.querySelectorAll(".clickable");

        leaves.forEach(leaf => {
            leaf.addEventListener("click", () => {

                //ここのstaticからdynamicにクリック時に切り替えてもぎ取るような動作の
                // やり方がわからなかったので、AIを使用しました。
                leaf.removeAttribute("animation");
                leaf.removeAttribute("static-body");

                leaf.setAttribute(
                    "dynamic-body",
                    "mass:10; linearDamping:0"
                );

                setTimeout(() => {
                    leaf.body.velocity.set(0, -10, 0);
                    leaf.body.angularVelocity.set(0, 0, 0);
                }, 50);
            });
        });
    </script>
